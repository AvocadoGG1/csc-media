name: autopost
# Posts scheduled Instagram/Discord content for the CSUN Citizen Science Club (see autopost/schedule.json).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args, e.g. --dry-run --only=carousel_health_fair"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # lets a run start the next one (relay), since GitHub's cron is sparse on quiet repos

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a run may wait up to 5.5 h for the next post
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # latest main, not the (possibly stale) commit that triggered this run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet cryptography
      - name: Post anything that is due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MEDIA_KEY: ${{ secrets.MEDIA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python autopost/run.py ${{ github.event.inputs.args }}   # saves state itself right after each post
